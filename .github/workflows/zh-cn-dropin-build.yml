name: zh-CN Drop-In Build

on:
  push:
    branches:
      - zh-cn-r2606
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Accept Android SDK licenses
        run: yes | /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager --licenses > /dev/null || true

      - name: Validate Android resources
        run: ./gradlew :manager:processDropinDebugResources

      - name: Build Drop-In debug APK
        run: ./gradlew :manager:assembleDropinDebug

      - name: Collect APK
        run: |
          mkdir -p out
          APK=$(find manager/build/outputs/apk -type f -iname '*dropin*debug*.apk' -o -type f -path '*/dropin/debug/*.apk' | head -n 1)
          test -n "$APK"
          cp "$APK" out/Shizuku+-Drop-In-v13.6.0.r2606-zhCN-debug.apk
          sha256sum out/*.apk | tee out/SHA256SUMS.txt

      - name: Upload localized Drop-In APK
        uses: actions/upload-artifact@v4
        with:
          name: Shizuku-Plus-Drop-In-r2606-zhCN-debug
          path: out/*
          if-no-files-found: error
