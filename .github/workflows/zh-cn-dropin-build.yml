name: zh-CN r2606 Drop-In Build

on:
  push:
    branches: [zh-cn-r2606-clean]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: Validate localized resources
        run: ./gradlew :manager:processDropinDebugResources
      - name: Build Drop-In debug APK
        run: ./gradlew :manager:assembleDropinDebug
      - name: Collect APK
        run: |
          mkdir -p out
          APK=$(find manager/build/outputs/apk -type f -path '*/dropin/debug/*.apk' | head -n 1)
          test -n "$APK"
          cp "$APK" out/Shizuku+-Drop-In-v13.6.0.r2606-zhCN-debug.apk
          sha256sum out/*.apk > out/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: Shizuku-Plus-Drop-In-r2606-zhCN-debug
          path: out/*
          if-no-files-found: error
